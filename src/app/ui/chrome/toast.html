<p class="text">
  <strong>{{ heading() }}</strong>
  {{ detail() }}
</p>
@if (dismissLabel(); as dismissText) {
  <div class="buttons">
    <button type="button" class="bb-button action" (click)="dismiss.emit()">
      {{ dismissText }}
    </button>
    @if (actionLabel(); as label) {
      <button type="button" class="bb-button bb-button--default action" (click)="act.emit()">
        {{ label }}
      </button>
    }
  </div>
} @else {
  @if (actionLabel(); as label) {
    <button type="button" class="bb-button action" (click)="act.emit()">{{ label }}</button>
  }
  @if (dismissible()) {
    <button
      type="button"
      class="close"
      [attr.aria-label]="strings.toast.dismiss"
      (click)="dismiss.emit()"
    >
      ×
    </button>
  }
}
