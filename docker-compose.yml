version: '3.8'

services:
  bubble-breaker:
    build: .
    container_name: bubble-breaker
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - bubble-breaker-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bubble-breaker.rule=Host(`bubble-breaker.yourdomain.com`)"
      - "traefik.http.routers.bubble-breaker.tls=true"
      - "traefik.http.services.bubble-breaker.loadbalancer.server.port=80"

networks:
  bubble-breaker-net:
    driver: bridge